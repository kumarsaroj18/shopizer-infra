# =============================================================================
# Shopizer Combined Frontend – nginx.conf
#
# Serves two independent SPAs from a single Nginx process:
#   Port 8081  →  Angular Admin UI    (root: /usr/share/nginx/html/admin)
#   Port 8082  →  React Shop UI       (root: /usr/share/nginx/html/react)
#
# Each app believes it is served from "/", so no build-time base-href changes
# are needed in either Angular or React.
#
# Both server blocks proxy /api/* upstream to shopizer-backend:8080.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # =========================================================================
    # Admin UI — Angular (port 8081)
    # =========================================================================
    server {
        listen 8081;
        server_name localhost;

        root  /usr/share/nginx/html/admin;
        index index.html;

        # Cache hashed JS/CSS/image assets for 1 year; never cache index.html
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # API proxy → Spring Boot backend
        location /api/ {
            proxy_pass            http://shopizer-backend:8080/api/;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    120s;
            proxy_connect_timeout 10s;
        }

        # Angular HTML5 history-API routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # =========================================================================
    # React Shop — React (port 8082)
    # =========================================================================
    server {
        listen 8082;
        server_name localhost;

        root  /usr/share/nginx/html/react;
        index index.html;

        # Cache hashed JS/CSS/image assets for 1 year; never cache index.html
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # Build provenance endpoint  →  curl http://localhost:8082/build-info
        location = /build-info {
            alias /usr/share/nginx/html/react/metadata/build-info.json;
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin *;
            expires 0;
        }

        # API proxy → Spring Boot backend
        location /api/ {
            proxy_pass            http://shopizer-backend:8080/api/;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    120s;
            proxy_connect_timeout 10s;
        }

        # React HTML5 history-API routing fallback (must be last)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
