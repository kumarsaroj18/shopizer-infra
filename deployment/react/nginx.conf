# nginx config for React e-commerce shop
# Routes:
#   /          → React SPA (with HTML5 pushState fallback)
#   /api/*     → proxy to shopizer-backend:8080

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets aggressively; never cache index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Build metadata endpoint (CI + CD provenance)
    # Returns: version, imageTag, gitSha, builtAt …
    # Example: curl http://localhost:8082/build-info
    location = /build-info {
        alias /usr/share/nginx/html/metadata/build-info.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
        expires 0;
    }

    # API proxy → Spring Boot backend
    location /api/ {
        proxy_pass         http://shopizer-backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # React HTML5 routing fallback (must be last)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
