# ─────────────────────────────────────────────────────────────────────────────
# CD Workflow for shopizer-shop-reactjs (React)
#
# LOCATION: Reference copy. Authoritative version:
#   shopizer-shop-reactjs/.github/workflows/cd-react.yml
#
# ⚠️  Key facts:
#   • CI workflow name: "CI/CD Pipeline"  (not "CI Pipeline")
#   • CI artifact pattern: shopizer-react-build-<run_number> (path: build/ flat)
#   • Dockerfile lives in shopizer-infra (not in the react source repo)
# ─────────────────────────────────────────────────────────────────────────────
name: CD – React Shop (shopizer-shop-reactjs)

on:
  workflow_run:
    # ⚠️  Must match `name:` in shopizer-shop-reactjs/ci-cd.yml exactly: "CI/CD Pipeline"
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID to deploy'
        required: false
        type: string

env:
  IMAGE_NAME: shopizer-react
  NODE_VERSION: '18'
  # Infra repo that owns the Dockerfile + nginx.conf for all services
  INFRA_REPO: ${{ github.repository_owner }}/shopizer-infra

jobs:
  guard:
    name: Check CI status
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      ci_run_id: ${{ steps.check.outputs.ci_run_id }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            else
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "ci_run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
            fi
          else
            CI_RUN="${{ github.event.inputs.ci_run_id }}"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "ci_run_id=${CI_RUN}" >> $GITHUB_OUTPUT
          fi

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.should_deploy == 'true'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      # ── Checkout (package.json only from react; Dockerfile from shopizer-infra) ─
      - name: Checkout shopizer-shop-reactjs (sparse – package.json)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
          sparse-checkout-cone-mode: false

      # ── Extract version from package.json ─────────────────────────────────────
      - name: Extract version
        id: meta
        run: |
          RAW_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          VERSION=${RAW_VERSION:-1.0.0}
          if [[ "$VERSION" == "undefined" ]]; then VERSION="1.0.0"; fi

          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-8)
          echo "version=${VERSION}"                   >> $GITHUB_OUTPUT
          echo "image_tag=${VERSION}-${SHORT_SHA}"    >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}"               >> $GITHUB_OUTPUT

      # ── Checkout shopizer-infra for Dockerfile + nginx.conf ──────────────────
      - name: Checkout shopizer-infra (Dockerfile + nginx.conf)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          path: shopizer-infra
          sparse-checkout: |
            deployment/react
          sparse-checkout-cone-mode: false

      # ── Resolve CI run ID ─────────────────────────────────────────────────────
      - name: Resolve CI run ID
        id: resolve_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ needs.guard.outputs.ci_run_id }}"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID=$(gh run list \
              --workflow "CI/CD Pipeline" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT

      # ── Download build artifact (CI must upload as "shopizer-react-build-*") ──
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.resolve_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: "shopizer-react-build-*"
          merge-multiple: true
          path: artifacts/

      - name: Stage build into Dockerfile build context
        run: |
          echo "Downloaded files:"
          find artifacts/ -type f | sort

          # CI uploads path: build/ – upload-artifact v4 strips the directory
          # so files land flat in artifacts/ (not in artifacts/build/).
          mkdir -p shopizer-infra/deployment/react/build

          if compgen -G "artifacts/*.tar.gz" > /dev/null; then
            tar -xzf artifacts/*.tar.gz -C shopizer-infra/deployment/react/build/
          elif [ -d "artifacts/build" ]; then
            cp -r artifacts/build/. shopizer-infra/deployment/react/build/
          else
            # Flat layout (upload-artifact v4 strips directory)
            cp -r artifacts/. shopizer-infra/deployment/react/build/
          fi

          # Overwrite/create build-info.json with Docker image metadata
          mkdir -p shopizer-infra/deployment/react/build/metadata
          cat > shopizer-infra/deployment/react/build/metadata/build-info.json <<EOF
          {
            "version":    "${{ steps.meta.outputs.version }}",
            "imageTag":   "${{ steps.meta.outputs.image_tag }}",
            "gitSha":     "${{ github.event.workflow_run.head_sha || github.sha }}",
            "shortSha":   "${{ steps.meta.outputs.short_sha }}",
            "ciRunId":    "${{ steps.resolve_run.outputs.run_id }}",
            "cdRunId":    "${{ github.run_id }}",
            "builtAt":    "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}"
          }
          EOF

          echo "Build files: $(find shopizer-infra/deployment/react/build -type f | wc -l) files"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: shopizer-infra/deployment/react
          file:    shopizer-infra/deployment/react/Dockerfile
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.image_tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Export image tar
        run: |
          mkdir -p image-export
          docker save \
            ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }} \
            | gzip > image-export/shopizer-react-${{ steps.meta.outputs.image_tag }}.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-react-${{ steps.meta.outputs.image_tag }}
          path: image-export/shopizer-react-${{ steps.meta.outputs.image_tag }}.tar.gz
          retention-days: 30
          compression-level: 0

      - name: Write job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<END
          ## ✅ Docker Image Built – shopizer-react

          | Field      | Value |
          |------------|-------|
          | Image tag  | \`${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}\` |
          | Version    | \`${{ steps.meta.outputs.version }}\` |
          | Artifact   | \`docker-image-react-${{ steps.meta.outputs.image_tag }}\` |

          **Deploy locally:**
          \`\`\`bash
          cd deployment
          ./deploy-local.sh --react-tag ${{ steps.meta.outputs.image_tag }}
          \`\`\`
          END
