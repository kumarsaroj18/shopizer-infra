# ─────────────────────────────────────────────────────────────────────────────
# CD Workflow for shopizer-shop-reactjs (React)
#
# LOCATION: Reference copy. Authoritative version:
#   shopizer-shop-reactjs/.github/workflows/cd-react.yml
#
# ⚠️  Key facts:
#   • CI workflow name: "CI/CD Pipeline"  (not "CI Pipeline")
#   • CI artifact pattern: shopizer-react-build-<run_number> (path: build/ flat)
#   • Dockerfile.ci lives in the shopizer-shop-reactjs source repo (not shopizer-infra)
# ─────────────────────────────────────────────────────────────────────────────
name: CD – React Shop (shopizer-shop-reactjs)

on:
  workflow_run:
    # ⚠️  Must match `name:` in shopizer-shop-reactjs/ci-cd.yml exactly: "CI/CD Pipeline"
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID to deploy'
        required: false
        type: string

env:
  IMAGE_NAME: shopizer-frontend
  ADMIN_REPO: ${{ github.repository_owner }}/shopizer-admin
  DOCKER_CONTEXT: colima-shopizer

jobs:
  guard:
    name: Check CI status
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      ci_run_id: ${{ steps.check.outputs.ci_run_id }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            else
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "ci_run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
            fi
          else
            CI_RUN="${{ github.event.inputs.ci_run_id }}"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "ci_run_id=${CI_RUN}" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    name: Build combined frontend image and deploy to Colima
    runs-on: self-hosted
    needs: guard
    if: needs.guard.outputs.should_deploy == 'true'
    env:
      INFRA_DIR: ${{ vars.INFRA_DIR }}

    steps:
      - name: Checkout shopizer-shop-reactjs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
          sparse-checkout-cone-mode: false

      - name: Extract version
        id: meta
        run: |
          RAW=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          VERSION="${RAW:-1.0.0}"
          [[ "$VERSION" == "undefined" ]] && VERSION="1.0.0"
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-8)
          echo "version=${VERSION}"                >> $GITHUB_OUTPUT
          echo "image_tag=${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Resolve CI run ID
        id: resolve_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ needs.guard.outputs.ci_run_id }}"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "CI/CD Pipeline" \
              --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT

      # ── Download react build from this repo ──────────────────────────────────
      - name: Download react build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INFRA="${INFRA_DIR:-$HOME/shopizer-infra}"
          mkdir -p artifacts/react
          gh run download "${{ steps.resolve_run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --pattern "shopizer-react-build-*" \
            --dir artifacts/react/
          rm -rf "$INFRA/deployment/frontend/react-build"
          mkdir -p "$INFRA/deployment/frontend/react-build"
          if find artifacts/react -name "*.tar.gz" | grep -q .; then
            tar -xzf "$(find artifacts/react -name "*.tar.gz" | head -1)" \
              -C "$INFRA/deployment/frontend/react-build/"
          elif [[ -d artifacts/react/build ]]; then
            cp -r artifacts/react/build/. "$INFRA/deployment/frontend/react-build/"
          else
            cp -r artifacts/react/. "$INFRA/deployment/frontend/react-build/"
          fi
          echo "React build: $(find $INFRA/deployment/frontend/react-build -type f | wc -l) files"

      # ── Download latest admin dist (cross-repo) ───────────────────────────────
      - name: Download latest admin dist artifact
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          INFRA="${INFRA_DIR:-$HOME/shopizer-infra}"
          ADMIN_RUN=$(gh run list \
            --repo "${{ env.ADMIN_REPO }}" \
            --workflow "CI" \
            --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          mkdir -p artifacts/admin
          gh run download "$ADMIN_RUN" \
            --repo "${{ env.ADMIN_REPO }}" \
            --pattern "shopizer-admin-build-*" \
            --dir artifacts/admin/
          TARBALL=$(find artifacts/admin -name "*.tar.gz" | head -1)
          if [[ -z "$TARBALL" ]]; then
            echo "ERROR: admin dist tarball not found"; ls -R artifacts/admin; exit 1
          fi
          rm -rf "$INFRA/deployment/frontend/admin-dist"
          mkdir -p "$INFRA/deployment/frontend/admin-dist"
          tar -xzf "$TARBALL" -C "$INFRA/deployment/frontend/admin-dist/"
          echo "Admin dist: $(find $INFRA/deployment/frontend/admin-dist -type f | wc -l) files"

      # ── Build combined image directly into Colima daemon ──────────────────────
      - name: Build shopizer-frontend image
        run: |
          INFRA="${INFRA_DIR:-$HOME/shopizer-infra}"
          docker build \
            --build-arg APP_VERSION_REACT="${{ steps.meta.outputs.image_tag }}" \
            -t "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            -f "$INFRA/deployment/frontend/Dockerfile" \
            "$INFRA/deployment/frontend"
          docker images "${{ env.IMAGE_NAME }}" --format "  {{.Repository}}:{{.Tag}}  {{.Size}}"

      - name: Deploy to Colima
        run: |
          INFRA="${INFRA_DIR:-$HOME/shopizer-infra}"
          ENV_FILE="$INFRA/deployment/.env"
          [[ ! -f "$ENV_FILE" ]] && echo "ERROR: $ENV_FILE not found. Run provision.sh first." && exit 1
          if grep -q "^IMAGE_TAG_FRONTEND=" "$ENV_FILE"; then
            sed -i '' "s|^IMAGE_TAG_FRONTEND=.*|IMAGE_TAG_FRONTEND=${{ steps.meta.outputs.image_tag }}|" "$ENV_FILE"
          else
            echo "IMAGE_TAG_FRONTEND=${{ steps.meta.outputs.image_tag }}" >> "$ENV_FILE"
          fi
          docker compose \
            -f "$INFRA/deployment/docker-compose.yml" \
            --env-file "$ENV_FILE" \
            up -d --no-deps shopizer-frontend

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' shopizer-frontend 2>/dev/null || echo not_found)
            [[ "$STATUS" == "healthy" ]] && echo "shopizer-frontend is healthy" && exit 0
            printf "  [%2d/12] %s\n" "$i" "$STATUS"; sleep 5
          done
          echo "Health after 60s: $(docker inspect --format='{{.State.Health.Status}}' shopizer-frontend 2>/dev/null)"

      - name: Clean up staged build artifacts
        if: always()
        run: |
          INFRA="${INFRA_DIR:-$HOME/shopizer-infra}"
          rm -rf "$INFRA/deployment/frontend/admin-dist" "$INFRA/deployment/frontend/react-build"

      - name: Write job summary
        if: always()
        run: |
          echo "## Frontend Deployed to Colima" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin UI | http://localhost:8081 |" >> $GITHUB_STEP_SUMMARY
          echo "| React Shop | http://localhost:8082 |" >> $GITHUB_STEP_SUMMARY
          END
