# ─────────────────────────────────────────────────────────────────────────────
# Shopizer – Unified Local Docker Compose
#
# Usage:
#   cp .env.example .env && edit .env
#   docker compose up -d
#
# Image tags are controlled via .env (IMAGE_TAG_BACKEND, etc.)
# so you can roll forward/back without editing this file.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  # Backend / database traffic (not exposed outside compose)
  internal:
    driver: bridge
  # Frontend → backend traffic
  frontend:
    driver: bridge

volumes:
  mysql_data:
  shopizer_files:   # persistent file storage (product images, etc.)

services:

  # ── MySQL 8 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: shopizer-mysql
    restart: unless-stopped
    networks:
      - internal
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-SALESMANAGER}
      MYSQL_USER: ${MYSQL_USER:-shopizer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopizer_pass}
    ports:
      # Expose only on loopback – not accessible from outside host
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${MYSQL_USER:-shopizer}",
             "-p${MYSQL_PASSWORD:-shopizer_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  shopizer-backend:
    image: shopizer:${IMAGE_TAG_BACKEND:-ci-latest}
    pull_policy: never
    container_name: shopizer-backend
    restart: unless-stopped
    networks:
      - internal
      - frontend
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Persistent file storage (uploaded images, documents)
      - shopizer_files:/files
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SERVER_PORT: 8080
      APP_FILES_PATH: /files

      # ── Database ──────────────────────────────────────────────────────────
      # Shopizer uses CUSTOM property names (db.jdbcUrl / db.user / db.password)
      # defined in application-mysql.properties and read by DataConfiguration.
      # Spring Boot relaxed binding maps DB_JDBCURL → db.jdbcUrl, etc.
      # NOTE: Must be a single-line string – YAML >- folds newlines to spaces
      # which produces an invalid JDBC URL with embedded spaces.
      DB_JDBCURL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-SALESMANAGER}?autoReconnect=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: ${MYSQL_USER:-shopizer}
      DB_PASSWORD: ${MYSQL_PASSWORD:-shopizer_pass}
      DB_DRIVERCLASS: com.mysql.cj.jdbc.Driver

      # ── Hibernate ─────────────────────────────────────────────────────────
      HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      HIBERNATE_HBM2DDL_AUTO: update

      # ── JVM ───────────────────────────────────────────────────────────────
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -Djava.security.egd=file:/dev/./urandom

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: >
        wget -qO- http://localhost:8080/actuator/health
        | grep -q '"status":"UP"' || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    # Resource limits (Colima default: 2 CPU, 2 GB RAM)
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # ── Angular Admin UI (:8081) ─────────────────────────────────────────────
  shopizer-admin:
    image: shopizer-admin:${IMAGE_TAG_ADMIN:-ci-latest}
    pull_policy: never
    container_name: shopizer-admin
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:80"
    depends_on:
      shopizer-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── React Shop UI (:8082) ─────────────────────────────────────────────────
  shopizer-shop:
    image: shopizer-shop-reactjs:${IMAGE_TAG_SHOP:-ci-latest}
    pull_policy: never
    container_name: shopizer-shop
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "127.0.0.1:${SHOP_PORT:-8082}:80"
    depends_on:
      shopizer-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
